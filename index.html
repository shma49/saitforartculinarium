<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Начинки и декор</title>
    <style>
        /* ----------------------------------------------- */
        /*   БАЗА                                            */
        /* ----------------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #fdf2f5 0%, #fce4ec 100%);
            min-height: 100vh;
            padding: 30px 20px 60px;
            transition: background 0.8s ease;
        }

        /* ----------------------------------------------- */
        /*   ТЕМЫ                                            */
        /* ----------------------------------------------- */
        body.theme-chocolate { background: linear-gradient(145deg, #2c1810 0%, #4a2c2a 100%); color: #fff; }
        body.theme-berry { background: linear-gradient(145deg, #fce4ec 0%, #f8bbd0 100%); }
        body.theme-nut { background: linear-gradient(145deg, #f5e6d3 0%, #e8d5c4 100%); }
        body.theme-classic { background: linear-gradient(145deg, #fff8f0 0%, #f5ede4 100%); }

        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            top: -10%;
            font-size: 2.5rem;
            opacity: 0;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.7; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0.2; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1300px;
            margin: 0 auto;
        }

        /* ----------------------------------------------- */
        /*   ШАПКА                                           */
        /* ----------------------------------------------- */
        .header {
            text-align: center;
            padding: 20px 20px 15px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: inherit;
        }
        .header nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 1.1rem;
            font-weight: 500;
        }
        .header nav a {
            color: inherit;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 40px;
            transition: 0.2s ease;
            opacity: 0.7;
        }
        .header nav a:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.15);
        }

        /* ----------------------------------------------- */
        /*   ГЕРОЙ                                           */
        /* ----------------------------------------------- */
        .hero {
            text-align: center;
            padding: 20px 0 30px;
            margin-bottom: 30px;
        }
        .hero-image {
            width: 100%;
            max-height: 60vh;
            object-fit: cover;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.06);
        }
        .scroll-indicator {
            text-align: center;
            margin-top: 25px;
        }
        .arrow-down {
            display: inline-block;
            width: 32px;
            height: 32px;
            border-right: 2px solid #888;
            border-bottom: 2px solid #888;
            transform: rotate(45deg);
            animation: bounce 2s infinite;
            opacity: 0.5;
        }
        @keyframes bounce {
            0%,
            100% { transform: rotate(45deg) translate(0, 0); }
            50% { transform: rotate(45deg) translate(6px, 6px); }
        }

        /* ----------------------------------------------- */
        /*   ФИЛЬТРЫ                                         */
        /* ----------------------------------------------- */
        .filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
        }
        .filter-btn {
            padding: 10px 26px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            color: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s ease;
        }
        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
        }
        .filter-btn.active {
            background: rgba(255, 255, 255, 0.22);
            border-color: #fff;
        }

        /* ----------------------------------------------- */
        /*   НАЧИНКИ                                         */
        /* ----------------------------------------------- */
        .cakes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }
        .cake-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 20px 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transition: 0.3s ease;
        }
        .cake-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.95);
        }
        .cake-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 12px;
            background: #fce4ec;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #aaa;
        }
        .cake-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 30%;
            transform: scale(1.15);
            display: block;
        }
        .cake-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        .cake-desc {
            font-size: 0.85rem;
            color: #555;
            line-height: 1.3;
            min-height: 38px;
        }

        /* ===== СЕРДЕЧКИ ===== */
        .like-btn {
            position: absolute;
            top: 10px;
            right: 14px;
            font-size: 2rem;
            background: none;
            border: none;
            cursor: pointer;
            transition: 0.2s ease;
            color: #ddd;
            z-index: 2;
            padding: 4px;
            line-height: 1;
        }
        .like-btn:hover {
            transform: scale(1.2);
        }
        .like-btn.selected {
            color: #d81b60;
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* ----------------------------------------------- */
        /*   КАРУСЕЛЬ ДЕКОРА (уменьшенные картинки)         */
        /* ----------------------------------------------- */
        .decor-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }
        .section-title {
            font-size: 2.2rem;
            font-weight: 300;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .section-subtitle {
            text-align: center;
            font-size: 1rem;
            opacity: 0.7;
            margin-bottom: 30px;
            font-style: italic;
        }

        .carousel-container {
            position: relative;
            max-width: 700px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            padding: 15px 0;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            gap: 16px;
            padding: 0 16px;
        }

        .carousel-slide {
            min-width: calc(33.333% - 12px);
            flex-shrink: 0;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            max-height: 200px;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .carousel-slide .star-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            font-size: 1.4rem;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s ease;
            color: #fff;
            padding: 0;
            line-height: 1;
            z-index: 2;
            pointer-events: all;
        }
        .carousel-slide .star-btn:hover {
            transform: scale(1.1);
        }
        .carousel-slide .star-btn.active {
            color: #ffd700;
            background: rgba(0, 0, 0, 0.5);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: inherit;
            font-size: 1.6rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: all;
        }
        .carousel-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .carousel-btn.prev {
            left: 6px;
        }
        .carousel-btn.next {
            right: 6px;
        }

        .carousel-indicators {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 14px;
        }
        .carousel-indicators .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            cursor: pointer;
            transition: 0.2s ease;
            pointer-events: all;
        }
        .carousel-indicators .dot.active {
            background: #d81b60;
            width: 20px;
            border-radius: 20px;
        }

        /* ===== ПЕРСОНАЖ ===== */
        .character {
            position: fixed;
            bottom: 40px;
            right: 30px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            z-index: 1000;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
            max-width: 90%;
        }
        .character.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }
        .character.hide {
            opacity: 0;
            transform: translateY(30px);
        }
        .character-avatar {
            font-size: 4.5rem;
            line-height: 1;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.1));
            animation: float 3s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes float {
            0%,
            100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .character-bubble {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 16px 22px;
            border-radius: 24px 24px 24px 4px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.95rem;
            line-height: 1.4;
            color: #1a1a1a;
            max-width: 300px;
            position: relative;
        }
        .character-bubble::before {
            content: '';
            position: absolute;
            bottom: 12px;
            left: -12px;
            width: 16px;
            height: 16px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 0 0 0 4px;
            transform: rotate(12deg);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .character-bubble strong {
            color: #d81b60;
        }

        /* ===== LIGHTBOX ===== */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .lightbox.active {
            opacity: 1;
            pointer-events: all;
        }

        .lightbox-frame {
            position: relative;
            border-radius: 24px;
            padding: 12px;
            background: conic-gradient(from 0deg, #f06292, #d81b60, #ff6f00, #f06292);
            background-size: 200% 200%;
            animation: rotateFrame 4s linear infinite;
            box-shadow: 0 0 60px rgba(233, 30, 99, 0.4);
            transform: scale(0.8);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1), opacity 0.4s ease;
        }
        .lightbox.active .lightbox-frame {
            transform: scale(1);
            opacity: 1;
        }
        @keyframes rotateFrame {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .lightbox-content {
            display: block;
            max-width: 80vw;
            max-height: 80vh;
            border-radius: 16px;
            background: #fff;
        }

        .lightbox-close {
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 2.6rem;
            color: #fff;
            cursor: pointer;
            transition: 0.2s ease;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #f06292;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            z-index: 10;
        }
        .lightbox-close:hover {
            transform: rotate(90deg) scale(1.1);
            background: #d81b60;
            border-color: #fff;
        }

        /* ===== КНОПКА НАВЕРХ ===== */
        .scroll-top-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 1500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .scroll-top-btn:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.25);
        }
        .scroll-top-btn.visible {
            opacity: 1;
            pointer-events: all;
        }

        /* ----------------------------------------------- */
        /*   АДАПТИВ                                         */
        /* ----------------------------------------------- */
        @media (max-width: 900px) {
            .carousel-slide {
                min-width: calc(50% - 10px);
            }
        }
        @media (max-width: 600px) {
            body { padding: 16px 12px 30px; }
            .header nav { gap: 16px; font-size: 0.95rem; }
            .hero-image { max-height: 40vh; border-radius: 28px; }
            .cakes-grid { grid-template-columns: 1fr 1fr; gap: 16px; }
            .cake-image { width: 90px; height: 90px; }
            .cake-name { font-size: 1rem; }
            .section-title { font-size: 1.6rem; }
            .carousel-slide { min-width: calc(50% - 8px); max-height: 150px; }
            .carousel-btn { width: 34px; height: 34px; font-size: 1.2rem; }
            .carousel-btn.prev { left: 4px; }
            .carousel-btn.next { right: 4px; }
            .character { bottom: 20px; right: 16px; left: 16px; }
            .character-avatar { font-size: 3.2rem; }
            .character-bubble { font-size: 0.85rem; padding: 12px 16px; max-width: 220px; }
            .lightbox-close { top: -10px; right: -10px; width: 40px; height: 40px; font-size: 2rem; }
            .lightbox-content { max-width: 90vw; max-height: 70vh; }
            .scroll-top-btn { width: 44px; height: 44px; font-size: 1.4rem; bottom: 20px; left: 20px; }
        }
        @media (max-width: 440px) {
            .cakes-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .cake-image { width: 80px; height: 80px; }
            .carousel-slide { min-width: calc(50% - 6px); max-height: 130px; }
        }
    </style>
</head>
<body>

    <div class="particles-container" id="particlesContainer"></div>

    <div class="character" id="character">
        <div class="character-avatar">👩‍🍳</div>
        <div class="character-bubble">
            <strong>❤️ Отметьте сердечком</strong> вкус, который вам понравился!
        </div>
    </div>

    <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Наверх">↑</button>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-frame" id="lightboxFrame">
            <img class="lightbox-content" id="lightboxImg" src="" alt="Увеличенное фото">
            <button class="lightbox-close" id="lightboxClose">✕</button>
        </div>
    </div>

    <div class="container">

        <header class="header">
            <nav>
                <a href="#nachinki">Начинки</a>
                <a href="#dekor">Декор</a>
            </nav>
        </header>

        <section class="hero">
            <img class="hero-image" src="images/hero.jpg" alt="Декор и начинки" loading="lazy">
            <div class="scroll-indicator">
                <span class="arrow-down"></span>
            </div>
        </section>

        <section id="nachinki">
            <div class="filters" id="filters"></div>
            <div class="cakes-grid" id="cakesGrid"></div>
        </section>

        <section id="dekor" class="decor-section">
            <h2 class="section-title">Декор</h2>
            <p class="section-subtitle">Исполняем любой декор по вашему желанию.</p>

            <div class="carousel-container" id="carouselContainer">
                <div class="carousel-track" id="carouselTrack">
                    <!-- Слайды будут добавлены через JavaScript -->
                </div>
                <button class="carousel-btn prev" id="prevBtn">‹</button>
                <button class="carousel-btn next" id="nextBtn">›</button>
                <div class="carousel-indicators" id="indicators"></div>
            </div>
        </section>

    </div>

    <script>
        // =============================================
        //   ПЕРСОНАЖ
        // =============================================
        const character = document.getElementById('character');

        function showCharacter() {
            character.classList.remove('hide', 'show');
            setTimeout(() => {
                character.classList.add('show');
            }, 100);
            setTimeout(() => {
                character.classList.remove('show');
                character.classList.add('hide');
            }, 5500);
        }

        // =============================================
        //   LIGHTBOX
        // =============================================
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxClose = document.getElementById('lightboxClose');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });

        // =============================================
        //   КНОПКА НАВЕРХ
        // =============================================
        const scrollBtn = document.getElementById('scrollTopBtn');

        window.addEventListener('scroll', function() {
            if (window.pageYOffset > 400) {
                scrollBtn.classList.add('visible');
            } else {
                scrollBtn.classList.remove('visible');
            }
        });

        scrollBtn.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // =============================================
        //   КАРУСЕЛЬ (АВТОМАТИЧЕСКАЯ + РУЧНОЕ УПРАВЛЕНИЕ)
        // =============================================
        const decorImages = [
            { src: 'images/1.jpg', id: 1 },
            { src: 'images/2.jpg', id: 2 },
            { src: 'images/3.jpg', id: 3 },
            { src: 'images/4.jpg', id: 4 },
            { src: 'images/5.jpg', id: 5 },
            { src: 'images/6.jpg', id: 6 },
            { src: 'images/7.jpg', id: 7 },
            { src: 'images/8.jpg', id: 8 },
            { src: 'images/9.jpg', id: 9 },
            { src: 'images/10.jpg', id: 10 },
            { src: 'images/11.jpg', id: 11 },
            { src: 'images/12.jpg', id: 12 },
            { src: 'images/13.jpg', id: 13 }
        ];

        const track = document.getElementById('carouselTrack');
        const indicators = document.getElementById('indicators');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const container = document.getElementById('carouselContainer');

        let currentIndex = 0;
        const slidesToShow = window.innerWidth <= 900 ? 2 : 3;
        const likedDecor = new Set();
        let autoPlayInterval = null;
        const autoPlayDelay = 3000;

        function renderCarousel() {
            track.innerHTML = '';
            indicators.innerHTML = '';

            decorImages.forEach((item, index) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                const isLiked = likedDecor.has(item.id);

                slide.addEventListener('click', function(e) {
                    if (e.target.closest('.star-btn')) return;
                    openLightbox(item.src);
                });

                slide.innerHTML = `
                    <img src="${item.src}" alt="Декор" loading="lazy" data-src="${item.src}">
                    <button class="star-btn ${isLiked ? 'active' : ''}" data-id="${item.id}">${isLiked ? '⭐' : '☆'}</button>
                `;

                const starBtn = slide.querySelector('.star-btn');
                starBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.dataset.id);
                    if (likedDecor.has(id)) {
                        likedDecor.delete(id);
                        this.classList.remove('active');
                        this.textContent = '☆';
                    } else {
                        likedDecor.add(id);
                        this.classList.add('active');
                        this.textContent = '⭐';
                    }
                });

                track.appendChild(slide);

                const dot = document.createElement('button');
                dot.className = 'dot';
                if (index === 0) dot.classList.add('active');
                dot.addEventListener('click', () => goTo(index));
                indicators.appendChild(dot);
            });

            updateCarousel();
            startAutoPlay();
        }

        function updateCarousel() {
            const totalSlides = decorImages.length;
            const maxIndex = Math.max(0, totalSlides - slidesToShow);
            if (currentIndex > maxIndex) currentIndex = maxIndex;
            const offset = currentIndex * (100 / slidesToShow);
            track.style.transform = `translateX(-${offset}%)`;

            document.querySelectorAll('.dot').forEach((dot, index) => {
                dot.classList.toggle('active', index === currentIndex);
            });
        }

        function goTo(index) {
            const totalSlides = decorImages.length;
            const maxIndex = Math.max(0, totalSlides - slidesToShow);
            currentIndex = Math.min(Math.max(0, index), maxIndex);
            updateCarousel();
            resetAutoPlay();
        }

        function nextSlide() {
            const totalSlides = decorImages.length;
            const maxIndex = Math.max(0, totalSlides - slidesToShow);
            if (currentIndex >= maxIndex) {
                currentIndex = 0;
            } else {
                currentIndex++;
            }
            updateCarousel();
        }

        function startAutoPlay() {
            if (autoPlayInterval) clearInterval(autoPlayInterval);
            autoPlayInterval = setInterval(nextSlide, autoPlayDelay);
        }

        function resetAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                startAutoPlay();
            }
        }

        function stopAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }
        }

        container.addEventListener('mouseenter', stopAutoPlay);
        container.addEventListener('mouseleave', startAutoPlay);
        container.addEventListener('touchstart', stopAutoPlay, { passive: true });
        container.addEventListener('touchend', startAutoPlay, { passive: true });

        prevBtn.addEventListener('click', () => goTo(currentIndex - 1));
        nextBtn.addEventListener('click', () => goTo(currentIndex + 1));

        window.addEventListener('resize', () => {
            const newSlidesToShow = window.innerWidth <= 900 ? 2 : 3;
            if (newSlidesToShow !== slidesToShow) {
                location.reload();
            }
        });

        // =============================================
        //   НАЧИНКИ (УДАЛЕНЫ КОЛИБРИ И ЛИМОННЫЙ)
        // =============================================
        const allCakes = [
            { name: "Непоняшка", category: "Секрет", desc: "Загадочный вкус, который мы пока держим в секрете.", hidden: true, emoji: true },
            { name: "Ореховый", category: "Ореховый", desc: "Бисквит с грецким орехом и кремом на основе вареной сгущенки." },
            { name: "Ванильная ягода", category: "Ягодный", desc: "Ванильный бисквит, сливочный крем-чиз, ягодная прослойка конфи." },
            { name: "Шоколадное наслаждение", category: "Шоколадный", desc: "Шоколадный бисквит с насыщенным шоколадным кремом." },
            { name: "Марракеш", category: "Ореховый", desc: "Морковный бисквит с грецким орехом, апельсиновый курд, крем маскарпоне." },
            { name: "Фисташка малина", category: "Ягодный", desc: "Фисташковый бисквит, конфи малина, крем-чиз с фисташкой." },
            { name: "Клубника со сливками", category: "Ягодный", desc: "Миндальный бисквит, клубника в сливочном креме." },
            { name: "Сникерс", category: "Шоколадный", desc: "Шоколадный бисквит, соленая карамель, арахисовое пралине." },
            { name: "Молочная девочка", category: "Классический", desc: "Нежный бисквит с кремом пломбир-клубника." },
            { name: "Красный бархат", category: "Шоколадный", desc: "Насыщенный влажный бисквит, кули из ягод, крем-чиз." },
            { name: "Вишня в шоколаде", category: "Ягодный", desc: "Бисквит шоколадный, вишневое кули, крем на основе маскарпоне." },
            { name: "Медовик", category: "Классический", desc: "Медовые коржи со сливочно-сметанным кремом." },
            { name: "Три шоколада", category: "Шоколадный", desc: "Муссовые слои на бисквитной основе (белый, молочный и темный шоколад)." },
            { name: "Клубника в шоколаде", category: "Ягодный", desc: "Шоколадный бисквит с клубничным кули." },
            { name: "Смородина лимон", category: "Ягодный", desc: "Лимонные коржи, смородиновая начинка и нежный крем." },
            { name: "Классическое удовольствие", category: "Классический", desc: "Классический бисквит, сливочный крем и грецкие орехи." },
            { name: "Шоколадный дуэт", category: "Шоколадный", desc: "Насыщенные шоколадные коржи с насыщенным шоколадным кремом." }
        ];

        const cakes = allCakes.filter(c => !c.hidden);

        // =============================================
        //   СОСТОЯНИЕ
        // =============================================
        let currentFilter = "Все";
        const liked = new Set();

        // =============================================
        //   ФУНКЦИЯ ДЛЯ КАРТИНОК
        // =============================================
        function getImageName(name) {
            return name.replace(/ /g, '_') + '.jpg';
        }

        // =============================================
        //   РЕНДЕР НАЧИНОК
        // =============================================
        function renderCakes(filterCategory = "Все") {
            const grid = document.getElementById('cakesGrid');
            grid.innerHTML = '';

            let filtered;
            if (filterCategory === "Все") {
                filtered = allCakes;
            } else {
                filtered = allCakes.filter(c => c.category === filterCategory && !c.hidden);
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; padding:30px; color:#999;">Нет начинок в этой категории</p>`;
                return;
            }

            filtered.forEach(cake => {
                const card = document.createElement('div');
                card.className = 'cake-card';
                const isLiked = liked.has(cake.name);

                let imgHtml;
                if (cake.emoji) {
                    imgHtml = `<div style="font-size:3rem;">🎂</div>`;
                } else {
                    const imgSrc = `images/${getImageName(cake.name)}`;
                    imgHtml = `<img src="${imgSrc}" alt="${cake.name}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=\\'font-size:3rem;\\'>🍰</div>'">`;
                }

                card.innerHTML = `
                    <button class="like-btn ${isLiked ? 'selected' : ''}" data-name="${cake.name}">${isLiked ? '❤️' : '♡'}</button>
                    <div class="cake-image" data-img="${cake.emoji ? '' : `images/${getImageName(cake.name)}`}">
                        ${imgHtml}
                    </div>
                    <div class="cake-name">${cake.name}</div>
                    <div class="cake-desc">${cake.desc}</div>
                `;
                grid.appendChild(card);

                const imgContainer = card.querySelector('.cake-image');
                if (!cake.emoji) {
                    const img = imgContainer.querySelector('img');
                    if (img) {
                        imgContainer.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const src = this.dataset.img || img.src;
                            if (src && !src.includes('undefined')) {
                                openLightbox(src);
                            }
                        });
                    }
                }
            });

            document.querySelectorAll('.like-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const name = this.dataset.name;
                    if (this.classList.contains('selected')) {
                        this.classList.remove('selected');
                        this.textContent = '♡';
                        liked.delete(name);
                    } else {
                        this.classList.add('selected');
                        this.textContent = '❤️';
                        liked.add(name);
                    }
                });
            });
        }

        // =============================================
        //   ФИЛЬТРЫ
        // =============================================
        function renderFilters() {
            const container = document.getElementById('filters');
            const categories = ["Все", ...new Set(cakes.map(c => c.category))];
            container.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                if (cat === currentFilter) btn.classList.add('active');
                btn.textContent = cat;
                btn.dataset.category = cat;
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.category;
                    renderCakes(currentFilter);
                    applyTheme(currentFilter);
                });
                container.appendChild(btn);
            });
        }

        // =============================================
        //   ТЕМЫ
        // =============================================
        const themes = {
            'Все': { particles: ['🌸', '✨', '🌸', '✨', '🌸', '💗'], bodyClass: 'theme-berry' },
            'Шоколадный': { particles: ['🍫', '🍫', '🍫', '🍫', '🍫'], bodyClass: 'theme-chocolate' },
            'Ягодный': { particles: ['🍓', '🍒', '🍓', '🍒', '🍓', '🍇'], bodyClass: 'theme-berry' },
            'Ореховый': { particles: ['🥜', '🌰', '🥜', '🌰', '🥜'], bodyClass: 'theme-nut' },
            'Классический': { particles: ['🍰', '🧁', '🍰', '🧁', '🍰'], bodyClass: 'theme-classic' }
        };

        const particlesContainer = document.getElementById('particlesContainer');

        function renderParticles(category) {
            particlesContainer.innerHTML = '';
            const theme = themes[category] || themes['Все'];
            const emojis = theme.particles;
            if (!emojis || emojis.length === 0) return;
            for (let i = 0; i < 16; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.textContent = emojis[i % emojis.length];
                p.style.left = Math.random() * 100 + '%';
                p.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
                p.style.animationDuration = (12 + Math.random() * 14) + 's';
                p.style.animationDelay = (Math.random() * 8) + 's';
                p.style.opacity = 0.3 + Math.random() * 0.4;
                particlesContainer.appendChild(p);
            }
        }

        function applyTheme(category) {
            document.body.className = '';
            const theme = themes[category] || themes['Все'];
            if (theme.bodyClass) document.body.classList.add(theme.bodyClass);
            renderParticles(category);
        }

        // =============================================
        //   ЗАПУСК
        // =============================================
        renderFilters();
        renderCakes(currentFilter);
        applyTheme(currentFilter);
        renderCarousel();

        setTimeout(showCharacter, 1500);
    </script>

</body>
</html>
